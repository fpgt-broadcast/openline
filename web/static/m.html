<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101215">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OpenLine Admin (phone)</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  #m { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }
  #m header { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom: 1px solid var(--line); }
  #m header b { font-size: 16px; }
  #m main { flex: 1; overflow-y: auto; padding: 10px 12px 16px; -webkit-overflow-scrolling: touch; }
  #m nav { display: flex; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); background: var(--panel); }
  #m nav button { flex: 1; border: 0; border-radius: 0; background: none; min-height: 52px; color: var(--muted); }
  #m nav button.on { color: var(--text); box-shadow: inset 0 2px 0 var(--text); }
  .sess { background: var(--panel); border-radius: 10px; padding: 10px; margin-bottom: 8px; border-left: 4px solid var(--line2); }
  .sess.talking { border-left-color: var(--bad); }
  .sess .who { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .sess .who b { font-size: 15px; }
  .sess .chs { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .sess .acts { display: flex; gap: 6px; }
  .sess .acts .mute { flex: 1; min-height: 46px; font-size: 15px; }
  .sess .acts .mute.on { background: #3a1517; border-color: #6b2a2d; color: #ffb4b6; }
  .bar { display: flex; gap: 6px; margin-bottom: 10px; }
  .bar input { flex: 1; }
  .urow { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--panel); border: 0; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; text-align: left; font-weight: 400; min-height: 56px; }
  .urow .grow b { font-size: 15px; }
  .acc { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .acc:last-child { border-bottom: 0; }
  .acc select { width: 150px; flex: none; }
  .check { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 14px; color: var(--text); }
  .check input { width: 22px; height: 22px; }
  .showhead { padding: 10px 4px 4px; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
  .toast.ok { background: #12301f; color: #7ee2a8; }
  .toast { background: var(--panel2); box-shadow: 0 4px 16px rgba(0,0,0,.5); position: fixed; left: 12px; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom)); max-width: 536px; margin: 0 auto; border-radius: 10px; z-index: 20; }
</style>
</head>
<body>
<div id="login" class="center">
  <form class="card" id="loginForm">
    <img class="logo" src="icon.svg" alt="" width="48" height="48">
    <h1>Admin</h1>
    <div class="muted small">Sign in with your name + PIN (admin users), or the admin password.</div>
    <label for="au">Name</label>
    <input type="text" id="au" autocomplete="username" autocapitalize="off">
    <label for="apin">PIN</label>
    <input type="password" id="apin" inputmode="numeric" autocomplete="current-password">
    <div class="small muted" style="margin:10px 0 0">— or —</div>
    <label for="ap">Admin password</label>
    <input type="password" id="ap" autocomplete="current-password">
    <button class="primary" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
    <div class="small muted" style="margin-top:10px"><a href="./">← Intercom</a> · <a href="admin.html">Full admin</a></div>
  </form>
</div>
<div id="m" class="hidden">
  <header>
    <img class="logo" src="icon.svg" alt="OpenLine" width="24" height="24">
    <b class="grow" id="title">Admin</b>
    <span class="small muted" id="count"></span>
    <a class="small" href="admin.html">Full admin</a>
  </header>
  <main id="body"></main>
  <nav>
    <button data-tab="live">Live</button>
    <button data-tab="users">Users</button>
  </nav>
</div>
<div id="toast" class="banner toast hidden" role="status"></div>
<script type="module" src="m.js"></script>
</body>
</html>
