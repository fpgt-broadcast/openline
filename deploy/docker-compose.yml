# Server + Cloudflare Tunnel: no port forwarding, automatic HTTPS.
#   1. In Cloudflare Zero Trust > Networks > Tunnels, create a tunnel and add a
#      public hostname (e.g. intercom.example.com) -> http://openline:8999
#   2. Put the tunnel token in deploy/.env as TUNNEL_TOKEN=...
#   3. docker compose up -d ; docker compose logs openline   (first-run admin password)
services:
  openline:
    build: ..
    restart: unless-stopped
    # Real visitor IPs come from the tunnel (for login rate limits).
    command: ["-trusted-proxy", "cloudflared"]
    volumes:
      - ./data:/data
    ports:
      # Only this computer can open http://localhost:8999 directly; everyone
      # else comes through the tunnel (HTTPS). Use "8999:8999" for plain-HTTP
      # LAN access, which skips Cloudflare.
      - "127.0.0.1:8999:8999"
  cloudflared:
    # "latest" tracks Cloudflare's supported release (versions expire after ~1 year).
    # Update with: docker compose pull cloudflared && docker compose up -d
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on: [openline]
